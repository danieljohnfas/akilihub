# render.yaml — AkiliBrain Infrastructure as Code
# Deploy all services: render blueprint sync
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── 1. Scrapling Sidecar (already deployed, keep in sync) ──────────────────
  - type: web
    name: akilihub-scraper
    runtime: docker
    dockerfilePath: ./scraper/Dockerfile
    dockerContext: ./scraper
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true

  # ── 2. Langflow — AI Workflow Builder ──────────────────────────────────────
  - type: web
    name: akilihub-langflow
    runtime: image
    image:
      url: docker.io/langflowai/langflow:latest
    plan: free
    region: oregon
    envVars:
      - key: LANGFLOW_DATABASE_URL
        fromDatabase:
          name: akilihub-langflow-db
          property: connectionString
      - key: LANGFLOW_AUTO_LOGIN
        value: "false"
    autoDeploy: false

  # ── 3. Crawl4AI — LLM Scraping API ────────────────────────────────────────
  - type: web
    name: akilihub-crawl4ai
    runtime: image
    image:
      url: docker.io/unclecode/crawl4ai:latest
    plan: free
    region: oregon
    envVars:
      - key: CRAWL4AI_API_TOKEN
        generateValue: true
    autoDeploy: false

  # ── 4. Maxun — Visual Web Scraper ──────────────────────────────────────────
  - type: web
    name: akilihub-maxun
    runtime: image
    image:
      url: docker.io/maxunhq/maxun-core:latest
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akilihub-maxun-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: akilihub-redis
          type: redis
          property: connectionString
    autoDeploy: false

  # ── 5. Stirling PDF — PDF Tools ────────────────────────────────────────────
  - type: web
    name: akilihub-stirling-pdf
    runtime: image
    image:
      url: docker.io/frooodle/s-pdf:latest
    plan: free
    region: oregon
    envVars:
      - key: DOCKER_ENABLE_SECURITY
        value: "false"
    autoDeploy: false

# ── Redis (for Maxun) ────────────────────────────────────────────────────────
  - type: redis
    name: akilihub-redis
    plan: free
    region: oregon
    ipAllowList: []

# ── Postgres databases ───────────────────────────────────────────────────────
databases:
  - name: akilihub-langflow-db
    plan: free
    region: oregon
    databaseName: langflow
    user: langflow

  - name: akilihub-maxun-db
    plan: free
    region: oregon
    databaseName: maxun
    user: maxun
