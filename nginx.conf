# nginx.conf — AkiliBrain reverse proxy config for Linode
# Cloudflare → nginx (port 80) → Next.js (port 3000)
#
# Cloudflare handles TLS termination. This config only speaks HTTP.
# Set SSL Mode to "Full" in Cloudflare dashboard (not "Full (Strict)")
# since we have no cert on the origin.

server {
    listen 80;
    server_name akilibrain.com www.akilibrain.com;

    # Respect Cloudflare's real visitor IP in logs and headers
    real_ip_header    CF-Connecting-IP;

    # Restrict direct access to the server IP (only allow Cloudflare-proxied traffic)
    # If you want to lock this down further, add Cloudflare IP ranges to a whitelist.

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;

        # WebSocket support (for hot reload / dev, but harmless in prod)
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";

        # Forward real client info
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # Disable nginx response buffering so Next.js Server Components stream correctly.
        # Next.js also sets X-Accel-Buffering: no on all responses as a belt-and-suspenders.
        proxy_buffering    off;

        # Generous timeouts for long-running Inngest webhook payloads
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;

        # Max body size for file uploads (adjust if needed)
        client_max_body_size 10m;
    }

    # Health check endpoint — used by Linode/monitoring
    location /api/health {
        proxy_pass http://web:3000/api/health;
        access_log off;
    }
}
