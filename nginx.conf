# nginx.conf — AkiliBrain reverse proxy config for Linode
# Cloudflare → nginx (port 80) → Next.js (port 3000)
#
# Cloudflare handles TLS termination. This config only speaks HTTP.
# Set SSL Mode to "Full" in the Cloudflare dashboard (not "Full (Strict)")
# since we have no cert on the origin.

# ── Trust Cloudflare's client-IP header ONLY when the request really comes from Cloudflare ──
# Without `set_real_ip_from`, `real_ip_header` does nothing and anyone can spoof their IP.
# Keep this list in sync with https://www.cloudflare.com/ips-v4 and /ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server_tokens off;

# Per-client request rate limit (after real-ip, $binary_remote_addr is the true visitor).
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

# Keep the scheme Cloudflare reports; fall back to nginx's own when absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name akilibrain.com www.akilibrain.com;

    # OPTIONAL origin lock-down: accept only Cloudflare (repeat the set_real_ip_from ranges above
    # as `allow` lines, then `deny all;`). Without it, anyone who learns this server's IP can
    # bypass Cloudflare's WAF/rate limiting by hitting port 80 directly. Alternatively firewall
    # port 80 to Cloudflare's ranges at Linode's Cloud Firewall.
    #
    # allow 173.245.48.0/20; ... allow 2c0f:f248::/32;
    # deny all;

    location / {
        limit_req zone=perip burst=40 nodelay;

        proxy_pass         http://web:3000;
        proxy_http_version 1.1;

        # No WebSocket upgrade: the app does not use it, and forwarding Upgrade headers exposes
        # Next.js' WebSocket-upgrade SSRF advisory.
        proxy_set_header   Connection "";

        # Forward real client info. X-Forwarded-For is OVERWRITTEN with the verified address
        # instead of appended to, so a client-supplied chain can never reach the app.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;

        # Disable nginx response buffering so Next.js Server Components stream correctly.
        proxy_buffering    off;

        # Generous timeouts for long-running Inngest webhook payloads
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;

        # Max body size for file uploads (CVs are limited to 5MB by the app)
        client_max_body_size 10m;
    }

    # Health check endpoint — used by Docker/monitoring; keep it out of the access log and rate limit.
    location = /api/health {
        proxy_pass http://web:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
