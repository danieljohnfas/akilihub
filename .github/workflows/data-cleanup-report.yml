name: Data Cleanup Hourly Report

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Send Report Endpoint
        run: |
          curl -X GET "https://akilibrain.com/api/admin/send-report" -H "User-Agent: GitHub-Action"
