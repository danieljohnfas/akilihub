name: Targeted Scraper Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180 # Cap at 3 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Create Remote Env File
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.remote
          echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env.remote
          echo "GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}" >> .env.remote
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env.remote
          echo "CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> .env.remote
          echo "SAMBANOVA_API_KEY=${{ secrets.SAMBANOVA_API_KEY }}" >> .env.remote
          echo "ZAI_API_KEY=${{ secrets.ZAI_API_KEY }}" >> .env.remote
          echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> .env.remote
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env.remote
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> .env.remote
          echo "HYPERBOLIC_API_KEY=${{ secrets.HYPERBOLIC_API_KEY }}" >> .env.remote
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env.remote
          echo "HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}" >> .env.remote
          echo "COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}" >> .env.remote
          echo "MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}" >> .env.remote
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env.remote
          echo "SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}" >> .env.remote
          echo "EXA_API_KEY=${{ secrets.EXA_API_KEY }}" >> .env.remote
          echo "GOOGLE_CSE_API_KEY=${{ secrets.GOOGLE_CSE_API_KEY }}" >> .env.remote
          echo "GOOGLE_CSE_ID=${{ secrets.GOOGLE_CSE_ID }}" >> .env.remote
          echo "GH_MODELS_TOKEN=${{ secrets.GH_MODELS_TOKEN }}" >> .env.remote
          echo "GITHUB_MODELS_TOKEN=${{ secrets.GH_MODELS_TOKEN }}" >> .env.remote

      - name: Run Company Discovery (Single Sweep)
        run: |
          # The CI=true environment variable tells the infinite loop to exit after one sweep
          CI=true npx tsx --env-file=.env.remote scripts/company-discovery.ts
        continue-on-error: true # Continue even if discovery hits API limits

      - name: Commit Discovered Companies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/sources/discovered-careers.json
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "chore: auto-update discovered careers registry" && git push)
        continue-on-error: true

      - name: Run Targeted Scraper
        run: |
          npx tsx --env-file=.env.remote scripts/targeted-scrape.ts
        continue-on-error: true # Ensure we finish gracefully
