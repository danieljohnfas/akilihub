name: Data Verification & Cleanup Loop

on:
  schedule:
    - cron: '*/5 * * * *' # Run every 5 minutes
  workflow_dispatch:

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          echo "Triggering cleanup chunk..."
          curl -X GET "https://akilibrain.com/api/admin/cron-verify?secret=start-cleaning-now" -H "User-Agent: GitHub-Action"
