name: Continuous Integration

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'src/lib/sources/discovered-careers.json'
      - 'src/lib/scrapers/parsers/**'
      - '**.md'
      - 'docs/**'
      - '.github/workflows/data-cleanup-report.yml'
      - '.github/workflows/mass-scrape.yml'
      - '.github/workflows/targeted-scrape.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'src/lib/sources/discovered-careers.json'
      - 'src/lib/scrapers/parsers/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  build-and-verify:
    name: Build & Lint Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: akilihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Verify Production Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/akilihub' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:password@localhost:5432/akilihub' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://akilibrain.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || 'placeholder-key' }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"
        run: npm run build
